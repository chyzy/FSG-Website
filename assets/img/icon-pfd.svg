<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" role="img" aria-label="FSG G1000 PFD app icon">
  <!-- Konwersja 1:1 z client/android/app/src/pfd/res/drawable/ic_fsg_splash.xml (repo FSG-G1000).
       Poprawka koloru = poprawka tam i tutaj. -->

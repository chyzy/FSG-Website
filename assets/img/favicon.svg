       oprawkom na jasnych motywach przeglądarki). Wersja uproszczona względem
       logo-fsg.svg — grubsze oprawki, płaskie wypełnienia czytelne w 16 px. -->
  <defs>
    <clipPath id="fav-l"><rect x="3" y="12" width="26" height="22" rx="6"/></clipPath>
    <clipPath id="fav-r"><rect x="35" y="12" width="26" height="22" rx="6"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0b0d10"/>
  <g transform="translate(32,33) scale(0.88) translate(-32,-23)">
    <g clip-path="url(#fav-l)">
      <rect x="3" y="12" width="26" height="22" fill="#1B3ED6"/>
      <rect x="1" y="24" width="30" height="11" fill="#4A8A2E"/>
      <rect x="1" y="23" width="30" height="1.9" fill="#FFFFFF"/>
      <path d="M16,16.6 L20,22.4 H12 Z" fill="#FFC61A"/>
    </g>
    <rect x="3" y="12" width="26" height="22" rx="6" fill="none" stroke="#f2f3f5" stroke-width="3.5"/>

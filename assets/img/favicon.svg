      <path d="M37,32.5 C43,24 49,20 59.5,13.5" fill="none" stroke="#F531E0" stroke-width="3.2" stroke-linecap="round"/>
    </g>
    <rect x="35" y="12" width="26" height="22" rx="6" fill="none" stroke="#f2f3f5" stroke-width="3.5"/>
    <path d="M29,18 C30.5,15.2 33.5,15.2 35,18" fill="none" stroke="#f2f3f5" stroke-width="3.5"/>
